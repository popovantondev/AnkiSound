name: Source and build checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies for model-free tests
        run: python -m pip install "numpy==1.26.4" "num2words==0.5.14" "zstandard==0.25.0" "sherpa-onnx==1.13.7"
      - name: Check Python sources
        run: python -m compileall -q Sources scripts
      - name: Run existing model-free tests
        run: python -m unittest discover -s Tests -v
      - name: Build application without launching it
        run: python scripts/build_app.py --output "build-ci/Anki SOUND.app"
