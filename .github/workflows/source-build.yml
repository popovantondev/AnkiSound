name: Source and build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies for model-free tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          wanted = {'numpy', 'num2words', 'zstandard', 'sherpa-onnx', 'sherpa-onnx-core', 'docopt'}
          pins = {line.split('==')[0]: line for line in Path('requirements.txt').read_text().splitlines() if '==' in line and line.split('==')[0] in wanted}
          if set(pins) != wanted:
              raise SystemExit('Missing exact dependency pins for model-free checks')
          if pins['sherpa-onnx'].split('==')[1] != pins['sherpa-onnx-core'].split('==')[1]:
              raise SystemExit('sherpa-onnx and sherpa-onnx-core must use the same version')
          subprocess.run([sys.executable, '-m', 'pip', 'install', *pins.values()], check=True)
          PY
      - name: Check Python sources
        run: python -m compileall -q Sources scripts
      - name: Run existing model-free tests
        run: python -m unittest discover -s Tests -v
      - name: Build application without launching it
        run: python scripts/build_app.py --output "build-ci/Anki SOUND.app"
