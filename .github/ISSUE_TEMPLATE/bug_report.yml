name: Bug report
description: Report a reproducible issue without sharing personal Anki data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach an Anki export, card text, audio, job folder, log, credential,
        or local file path. Use a synthetic example.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 3.4.10
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac type
      placeholder: macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a synthetic card example if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error details
      description: Remove card text, names, paths, account identifiers, and other personal information.
